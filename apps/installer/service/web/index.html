<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Installer</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa3b2; --accent:#4f8cff; --ok:#3fb27f; --bad:#e5534b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); padding:16px; }
  main { max-width: 760px; margin: 0 auto; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size: 20px; margin: 4px 0 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size: 14px; text-transform: uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text], input[type=password], input[type=search] { flex:1 1 220px; min-width:0; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:#0b0d11; color:var(--text); font-size:15px; }
  button { padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:#232836; color:var(--text); font-size:14px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:22px; text-align:center; color:var(--muted); cursor:pointer; }
  #drop.over { border-color:var(--accent); color:var(--text); }
  .status { display:grid; grid-template-columns: max-content 1fr; gap:4px 12px; font-size:14px; }
  .status dt { color:var(--muted); }
  .status dd { margin:0; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  table { width:100%; border-collapse: collapse; font-size:14px; }
  td { padding:7px 4px; border-top:1px solid var(--line); vertical-align: middle; }
  td .id { color:var(--muted); font-family: ui-monospace, Menlo, monospace; font-size:12px; word-break: break-all; }
  #apps td:first-child { width:100%; }
  td.ver { color:var(--muted); text-align:right; white-space:nowrap; padding-right:12px; }
  td.actions { text-align:right; white-space:nowrap; }
  .tablewrap { overflow:auto; max-height:420px; }
  pre { background:#0b0d11; border:1px solid var(--line); border-radius:8px; padding:10px; max-height:260px; overflow:auto; font-size:12px; margin:0; white-space:pre-wrap; word-break:break-word; }
  #msg { min-height: 1.4em; }
  #appsMsg { margin:0 0 8px; min-height:1.4em; }
  label.chk { color:var(--muted); font-size:13px; display:flex; gap:6px; align-items:center; }
  label.file { color:var(--muted); font-size:13px; display:flex; flex-direction:column; gap:4px; flex:1 1 220px; min-width:0; }
  #certInfo { margin:0 0 10px; }
</style>
</head>
<body>
<main>
  <h1>TV Installer</h1>

  <section class="card">
    <h2>PIN</h2>
    <div class="row">
      <input id="pin" type="password" inputmode="numeric" placeholder="6-digit PIN shown on the TV" autocomplete="off">
      <button id="savePin">Save</button>
      <span id="pinMsg"></span>
    </div>
  </section>

  <section class="card">
    <h2>Install</h2>
    <div id="drop">Drop a .wgt / .tpk here, or tap to choose a file
      <input id="file" type="file" accept=".wgt,.tpk" hidden>
    </div>
    <div class="row" style="margin-top:10px">
      <input id="url" type="text" placeholder="https://…/app.wgt  or  owner/repo (latest GitHub release)">
      <button id="installUrl" class="primary">Install from URL</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="chk"><input id="force" type="checkbox"> Install even if the package is unsigned</label>
    </div>
    <p id="msg"></p>
  </section>

  <section class="card">
    <h2>TV</h2>
    <dl class="status" id="status"><dt>Status</dt><dd>Loading…</dd></dl>
  </section>

  <section class="card">
    <h2>Signing certificate</h2>
    <p id="certInfo">Enter the PIN to see it.</p>
    <div class="row">
      <label class="file">Author .p12 <input id="certAuthor" type="file" accept=".p12"></label>
      <label class="file">Distributor .p12 <input id="certDistributor" type="file" accept=".p12"></label>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="certPassword" type="password" placeholder="Certificate password" autocomplete="off">
      <button id="certUpload" class="primary">Upload</button>
      <button id="certRemove" class="danger" disabled>Remove</button>
    </div>
    <p id="certMsg"></p>
  </section>

  <section class="card">
    <h2>Apps</h2>
    <div class="row" style="margin-bottom:8px">
      <input id="appSearch" type="search" placeholder="Search by name or id" autocomplete="off">
      <button id="refreshApps">Refresh</button>
    </div>
    <p id="appsMsg"></p>
    <div class="tablewrap"><table id="apps"><tbody><tr><td>Enter the PIN to list apps.</td></tr></tbody></table></div>
  </section>

  <section class="card">
    <h2>Log</h2>
    <pre id="log"></pre>
  </section>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pin = '';
  try { pin = localStorage.getItem('tboxPin') || ''; } catch (e) {}
  $('pin').value = pin;

  function setMsg(text, kind) {
    var m = $('msg');
    m.textContent = text || '';
    m.className = kind || '';
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({ 'X-PIN': pin }, opts.headers || {});
    return fetch(path, Object.assign({}, opts, { headers: headers })).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (!r.ok) { var e = new Error(body.error || ('HTTP ' + r.status)); e.status = r.status; e.code = body.code; throw e; }
        return body;
      });
    });
  }

  $('savePin').onclick = function () {
    pin = $('pin').value.trim();
    try { localStorage.setItem('tboxPin', pin); } catch (e) {}
    var m = $('pinMsg');
    if (!pin) { m.textContent = 'Enter the PIN shown on the TV'; m.className = 'bad'; return; }
    m.textContent = 'Checking…'; m.className = '';
    $('savePin').disabled = true;
    loadCert();
    loadApps().then(function (err) {
      $('savePin').disabled = false;
      m.textContent = err ? err.message : '✓ Saved';
      m.className = err ? 'bad' : 'ok';
    });
  };

  function forceQuery() { return $('force').checked ? '?force=1' : ''; }

  function handleResult(res) {
    if (res.ok) setMsg('Done: ' + (res.name || res.packageId) + ' ' + (res.version || ''), 'ok');
    else setMsg('Failed: ' + (res.error ? res.error + '. ' : '') + (res.hint || (res.error ? '' : 'see log')), 'bad');
    loadApps();
  }

  function handleError(e) {
    if (e.code === 'UNSIGNED') setMsg(e.message + ' Tick the checkbox to try anyway.', 'bad');
    else setMsg(e.message, 'bad');
  }

  function uploadFile(file) {
    if (!file) return;
    setMsg('Uploading ' + file.name + '…');
    file.arrayBuffer().then(function (buf) {
      return api('/api/install' + forceQuery(), { method: 'POST', body: buf, headers: { 'Content-Type': 'application/octet-stream' } });
    }).then(handleResult, handleError);
  }

  var drop = $('drop');
  drop.onclick = function () { $('file').click(); };
  $('file').onchange = function () { uploadFile(this.files[0]); this.value = ''; };
  drop.ondragover = function (e) { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = function () { drop.classList.remove('over'); };
  drop.ondrop = function (e) { e.preventDefault(); drop.classList.remove('over'); uploadFile(e.dataTransfer.files[0]); };

  $('installUrl').onclick = function () {
    var url = $('url').value.trim();
    if (!url) return;
    setMsg('Downloading on the TV…');
    api('/api/install-url' + forceQuery(), { method: 'POST', body: JSON.stringify({ url: url }), headers: { 'Content-Type': 'application/json' } })
      .then(handleResult, handleError);
  };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var allApps = null;

  // Shows the loaded apps whose name or id contains every word typed in the search box.
  function renderApps() {
    if (!allApps) return;
    var words = $('appSearch').value.toLowerCase().split(/\s+/).filter(Boolean);
    var shown = allApps.filter(function (a) {
      var text = ((a.name || '') + ' ' + a.id).toLowerCase();
      return words.every(function (w) { return text.indexOf(w) !== -1; });
    });
    var rows = shown.map(function (a) {
      return '<tr><td>' + esc(a.name) + '<br><span class="id">' + esc(a.id) + '</span></td>' +
        '<td class="ver">' + esc(a.version) + '</td>' +
        '<td class="actions"><button data-launch="' + esc(a.id) + '" data-name="' + esc(a.name) + '">Open</button> ' +
        '<button class="danger" data-uninstall="' + esc(a.id) + '" data-name="' + esc(a.name) + '">Uninstall</button></td></tr>';
    });
    var empty = !allApps.length ? 'No apps reported.' : 'No apps match “' + esc($('appSearch').value.trim()) + '”.';
    $('apps').innerHTML = '<tbody>' + (rows.join('') || '<tr><td>' + empty + '</td></tr>') + '</tbody>';
  }

  // Resolves with the error, or null once the list is shown.
  function loadApps() {
    if (!pin) return Promise.resolve(null);
    return api('/api/apps').then(function (res) {
      allApps = res.apps;
      renderApps();
      return null;
    }, function (e) {
      allApps = null;
      $('apps').innerHTML = '<tbody><tr><td class="bad">' + esc(e.message) + '</td></tr></tbody>';
      return e;
    });
  }
  $('refreshApps').onclick = function () { loadApps(); };
  $('appSearch').oninput = renderApps;

  $('apps').onclick = function (e) {
    var t = e.target;
    var name = t.dataset.name;
    if (t.dataset.launch) {
      setAppsMsg('Opening ' + name + ' on the TV…');
      t.disabled = true;
      api('/api/launch', { method: 'POST', body: JSON.stringify({ appId: t.dataset.launch }), headers: { 'Content-Type': 'application/json' } })
        .then(function () { setAppsMsg('Opened ' + name + '.', 'ok'); }, function (e) { setAppsMsg('Could not open ' + name + ': ' + e.message, 'bad'); })
        .then(function () { t.disabled = false; });
    } else if (t.dataset.uninstall) {
      if (!confirm('Uninstall ' + name + ' (' + t.dataset.uninstall + ')?')) return;
      setAppsMsg('Uninstalling ' + name + '…');
      t.disabled = true;
      api('/api/uninstall', { method: 'POST', body: JSON.stringify({ appId: t.dataset.uninstall }), headers: { 'Content-Type': 'application/json' } })
        .then(function (res) {
          if (res.ok) setAppsMsg('Uninstalled ' + name + '.', 'ok');
          else setAppsMsg('Could not uninstall ' + name + ': ' + (res.error || 'see the log'), 'bad');
        }, function (e) { setAppsMsg('Could not uninstall ' + name + ': ' + e.message, 'bad'); })
        .then(function () { t.disabled = false; loadApps(); });
    }
  };

  function setAppsMsg(text, kind) {
    $('appsMsg').textContent = text || '';
    $('appsMsg').className = kind || '';
  }

  function setCertMsg(text, kind) {
    $('certMsg').textContent = text || '';
    $('certMsg').className = kind || '';
  }

  function showCert(s) {
    var el = $('certInfo');
    $('certRemove').disabled = !s.configured;
    if (!s.configured) {
      el.innerHTML = s.storage === false
        ? '<span class="bad">This TV has no private storage for a certificate.</span>'
        : 'None: packages are installed as they are, so this TV only accepts ones already signed for it. Upload yours below, or run <code>npm run push -- --cert</code>.';
      return;
    }
    if (s.error) { el.innerHTML = '<span class="bad">' + esc(s.error) + '</span>'; return; }
    var tvs = s.distributor.duids.join(', ') || 'none';
    el.innerHTML = 'Every install is signed with <b>' + esc(s.author.name) + '</b> (expires ' + esc(s.author.expires.slice(0, 10)) + '). TVs: ' + esc(tvs) + ' ' +
      (s.coversThisTv === false ? '<span class="bad">(not this TV)</span>' : s.coversThisTv ? '<span class="ok">✓ includes this TV</span>' : '');
  }

  function loadCert() {
    if (!pin) return;
    api('/api/cert').then(showCert, function (e) { $('certInfo').innerHTML = '<span class="bad">' + esc(e.message) + '</span>'; });
  }

  // FileReader rather than file.arrayBuffer(), which old TV browsers lack.
  function fileBase64(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).replace(/^data:[^,]*,/, '')); };
      r.onerror = function () { reject(new Error('Cannot read ' + file.name)); };
      r.readAsDataURL(file);
    });
  }

  $('certUpload').onclick = function () {
    var a = $('certAuthor').files[0], d = $('certDistributor').files[0], pw = $('certPassword').value;
    if (!a || !d || !pw) return setCertMsg('Choose both .p12 files and enter their password.', 'bad');
    setCertMsg('Uploading…');
    Promise.all([fileBase64(a), fileBase64(d)]).then(function (files) {
      return api('/api/cert', { method: 'POST', body: JSON.stringify({ author: files[0], distributor: files[1], password: pw }), headers: { 'Content-Type': 'application/json' } });
    }).then(function (s) {
      $('certPassword').value = '';
      showCert(s);
      setCertMsg(s.warnings && s.warnings.length ? s.warnings.join(' ') : 'Saved. Every install is now signed with it.', s.warnings && s.warnings.length ? 'bad' : 'ok');
    }, function (e) { setCertMsg(e.message, 'bad'); });
  };

  $('certRemove').onclick = function () {
    if (!confirm('Remove the signing certificate from the TV? Packages will then be installed as they are.')) return;
    api('/api/cert/remove', { method: 'POST' }).then(function () { setCertMsg('Removed.', 'ok'); loadCert(); }, function (e) { setCertMsg(e.message, 'bad'); });
  };

  function yesNo(v) { return v ? '<span class="ok">yes</span>' : '<span class="bad">no</span>'; }

  function poll() {
    fetch('/api/status').then(function (r) { return r.json(); }).then(function (s) {
      var d = s.devInfo || {};
      var html = '';
      html += '<dt>Device</dt><dd>' + esc(d.name || d.model || 'unknown') + ' · Tizen ' + esc(s.platformVersion || '?') + '</dd>';
      html += '<dt>Developer mode</dt><dd>' + yesNo(d.devModeEnabled) + '</dd>';
      html += '<dt>Host PC IP</dt><dd>' + esc(d.hostIp || '?') + ' ' + (d.hostIsLocal ? '<span class="ok">✓</span>' : '<span class="bad">(must be 127.0.0.1)</span>') + '</dd>';
      html += '<dt>Busy</dt><dd>' + (s.busy ? esc((s.current && s.current.step) || 'working') : 'idle') + '</dd>';
      html += '<dt>DUID</dt><dd>' + esc(s.duid || 'unknown until Host PC IP is 127.0.0.1') + '</dd>';
      html += '<dt>Installer</dt><dd>v' + esc(s.version) + '</dd>';
      $('status').innerHTML = html;
      $('log').textContent = s.log.map(function (l) { return l.t.slice(11, 19) + '  ' + l.msg; }).join('\n');
      $('log').scrollTop = $('log').scrollHeight;
    }).catch(function () {
      $('status').innerHTML = '<dt>Status</dt><dd class="bad">TV not reachable</dd>';
    });
  }
  poll();
  setInterval(poll, 2000);
  loadApps();
  loadCert();
})();
</script>
</body>
</html>
