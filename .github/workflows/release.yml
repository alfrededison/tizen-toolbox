name: Build and release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches the Installer version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/.*<widget[^>]*version="\([^"]*\)".*/\1/p' apps/installer/config.xml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/installer/config.xml version $version"
            exit 1
          fi
      - run: npm install
      - run: npm test
      # Unsigned on purpose: a Samsung certificate only works on the TVs it
      # lists, so each user's own Installer (or Apps2Samsung) signs the package.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: wgt
          path: dist/*.wgt
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.wgt
